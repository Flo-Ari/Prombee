name: Windows desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements/windows.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Editor hierarchy, copy and preview tests
        run: |
          npm --prefix frontend ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend test
      - name: Install build dependencies
        run: python -m pip install -r backend/requirements/windows.txt -r backend/requirements/development.txt
      - name: Shared state persistence tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Bundle Microsoft offline WebView2 installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/prombee/windows-runtime | Out-Null
          $installer = Join-Path $env:GITHUB_WORKSPACE '.cache/prombee/windows-runtime/MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile $installer -TimeoutSec 180
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'WebView2 installer signature is not a valid Microsoft signature.' }
          if ((Get-Item $installer).Length -lt 50000000) { throw 'Expected the complete offline x64 runtime installer.' }
          (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content ([System.IO.Path]::ChangeExtension($installer, '.sha256')) -Encoding ascii
      - name: Build standalone executable
        run: python -m PyInstaller build_tools/windows/app.spec --noconfirm --workpath .cache/prombee/pyinstaller-windows --distpath dist/windows
      - name: Packaged native window, Unicode clipboard and close-save smoke test
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'prombee-smoke'
          $report = Join-Path $env:GITHUB_WORKSPACE 'dist/windows/smoke-result.json'
          $process = Start-Process 'dist/windows/Prombee.exe' -ArgumentList '--smoke-test', '--smoke-install-runtime', '--data-dir', "`"$data`"", '--smoke-result', "`"$report`"" -PassThru
          if (-not $process.WaitForExit(300000)) { $process.Kill(); throw 'Packaged Windows smoke test timed out.' }
          if ($process.ExitCode -ne 0) { if (Test-Path $report) { Get-Content $report }; throw "Smoke test exited $($process.ExitCode)." }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not ($result.ok -and $result.runtimePrepared -and $result.clipboard -and $result.closeSave -and $result.floatingRoundTrip -and $result.headerDrag -and $result.startupEditorOnly)) { throw 'Smoke report is incomplete.' }
          Get-Content $report
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { choco install innosetup --no-progress -y }
          $version = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          & $compiler "/DAppVersion=$version" build_tools/packaging/windows/prombee.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, verify application-folder data and preserve it during uninstall
        shell: pwsh
        run: |
          $version = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          $install = Join-Path $env:RUNNER_TEMP 'Prombee installed 测试'
          $setup = Start-Process "dist/windows/Prombee-$version-Windows-x64-Setup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$install`"" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Installation failed.' }
          $report = Join-Path $env:GITHUB_WORKSPACE 'dist/windows/installer-smoke.json'
          $process = Start-Process (Join-Path $install 'Prombee.exe') -ArgumentList '--smoke-test', '--smoke-result', "`"$report`"" -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'Installed application timed out.' }
          if ($process.ExitCode -ne 0) { if (Test-Path $report) { Get-Content $report }; throw 'Installed application failed.' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not ($result.headerDrag -and $result.startupEditorOnly -and $result.closeSave)) { throw 'Native drag/startup/save checks failed.' }
          if ($result.dataDir -ne (Join-Path $install 'data')) { throw 'Data was saved outside the application folder.' }
          Get-Content $report
          $uninstall = Start-Process (Join-Path $install 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or -not (Test-Path (Join-Path $install 'data/library.json'))) { throw 'Uninstall removed user data.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Prombee-Windows-x64
          path: dist/windows/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-smoke-report
          path: |
            dist/windows/smoke-result.json
            dist/windows/installer-smoke.json
          if-no-files-found: ignore
