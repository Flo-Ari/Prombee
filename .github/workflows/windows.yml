name: Windows desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-windows.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Editor hierarchy, copy and preview tests
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Install build dependencies
        run: python -m pip install -r requirements-windows.txt
      - name: Shared state persistence tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Ensure WebView2 runtime
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
          $process = Start-Process $installer -ArgumentList '/silent', '/install' -Wait -PassThru
          if ($process.ExitCode -ne 0) { Write-Host "WebView2 installer returned $($process.ExitCode); renderer smoke test will verify the installed runtime." }
      - name: Build standalone executable
        run: python -m PyInstaller Prombee-windows.spec --noconfirm --workpath work/pyinstaller-windows --distpath dist/windows
      - name: Packaged native window, Unicode clipboard and close-save smoke test
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'prombee-smoke'
          $report = Join-Path $env:GITHUB_WORKSPACE 'dist/windows/smoke-result.json'
          $process = Start-Process 'dist/windows/Prombee.exe' -ArgumentList '--smoke-test', '--data-dir', "`"$data`"", '--smoke-result', "`"$report`"" -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Packaged Windows smoke test timed out.' }
          if ($process.ExitCode -ne 0) { if (Test-Path $report) { Get-Content $report }; throw "Smoke test exited $($process.ExitCode)." }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not ($result.ok -and $result.clipboard -and $result.closeSave)) { throw 'Smoke report is incomplete.' }
          Get-Content $report
      - uses: actions/upload-artifact@v4
        with:
          name: Prombee-Windows-x64
          path: dist/windows/Prombee.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-smoke-report
          path: dist/windows/smoke-result.json
          if-no-files-found: ignore
