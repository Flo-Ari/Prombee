<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>提示蜂</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="mascot.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="logo.svg" alt="AI 蜜蜂标志" /><strong data-app-name
          >提示蜂</strong
        >
      </div>
      <button id="libraryTab" role="tab" aria-controls="libraryPanel">
        新建词集
      </button>
      <select id="recentSets" aria-label="最近使用的提示词集"></select>
      <button id="template" role="tab" aria-controls="editorPanel">模板</button>
      <button id="newDoc" title="新建一轮 Ctrl+Shift+N">＋ 新建</button
      ><select id="documents" aria-label="切换文档"></select>
      <button id="editorTab" role="tab" aria-controls="editorPanel">
        编写
      </button>
      <button id="compare" role="tab" aria-controls="comparePanel">
        历史对比</button
      ><button id="preview" role="tab" aria-controls="previewPanel">
        预览
      </button>
      <button id="commonTab" role="tab" aria-controls="editorPanel">
        常用提示词
      </button>
      <button id="shortcutsTab" role="tab" aria-controls="shortcutsPanel">
        快捷键
      </button>
      <div class="spacer"></div>
      <button id="theme" aria-label="主题" title="主题">☾</button
      ><button id="copy" class="primary">复制提示词</button>
    </header>
    <div
      id="editorToolbar"
      class="toolbar"
      role="toolbar"
      aria-label="文字格式"
    >
      <button id="multiSelect">多选</button>
      <button id="deleteEmpty" title="清理整份提示词的空标题和空条目">
        删除空项
      </button>
      <button id="undo" title="撤销 Ctrl+Z" aria-label="撤销">↶</button>
      <button id="redo" title="重做 Ctrl+Shift+Z" aria-label="重做">↷</button>
      <span class="separator"></span>
      <select id="font" aria-label="字体">
        <option value="Noto Sans CJK SC">思源黑体</option>
        <option value="Noto Serif CJK SC">思源宋体</option>
        <option value="Noto Sans Mono CJK SC">思源等宽</option>
        <option value="sans-serif">无衬线</option>
        <option value="serif">衬线</option>
        <option value="monospace">等宽</option></select
      ><input
        id="size"
        type="number"
        min="9"
        max="96"
        value="14"
        aria-label="字号"
      /><span class="separator"></span
      ><button id="bold" title="粗体 Ctrl+B"><b>B</b></button
      ><button id="italic" title="斜体 Ctrl+I"><i>I</i></button
      ><label class="color-control" title="文字颜色"
        ><span>A</span
        ><input
          id="color"
          type="color"
          value="#2563eb"
          aria-label="文字颜色" /></label
      ><button id="clear">清除格式</button><span class="separator"></span
      ><select id="headingLevel" aria-label="当前标题等级">
        <option value="0">标题等级</option>
        <option value="1">H1 一级标题</option>
        <option value="2">H2 二级标题</option>
        <option value="3">H3 三级标题</option>
        <option value="4">H4 四级标题</option>
        <option value="5">H5 五级标题</option>
        <option value="6">H6 六级标题</option>
      </select>
      <div id="batchControls" hidden>
        <span id="selectedCount"></span><button id="batchExclude">排除</button
        ><button id="batchDelete">删除</button>
      </div>
      <button id="voiceInput" aria-pressed="false" title="语音输入">
        语音输入
      </button>
      <textarea
        id="speechResult"
        aria-label="听写结果"
        hidden
        readonly
      ></textarea>
      <button id="copyAll" hidden>全部复制</button>
      <div class="spacer"></div>
      <div id="hierarchyControls" hidden>
        <label
          >历史层级
          <select id="hierarchyRound" aria-label="历史层级轮次"></select></label
        ><button id="copyHierarchy">复制层级</button>
      </div>
      <button id="deleteRound">删除本轮</button>
    </div>
    <div
      id="previewToolbar"
      class="toolbar"
      role="toolbar"
      aria-label="预览设置"
      hidden
    >
      <input id="previewMode" type="hidden" value="rendered" />
      <button id="previewRendered" aria-pressed="true">Markdown 预览</button
      ><button id="previewRaw" aria-pressed="false">原始 Markdown</button
      ><span class="toolbar-note">仅显示参与复制的内容</span>
    </div>
    <div
      id="compareToolbar"
      class="toolbar"
      role="toolbar"
      aria-label="历史对比设置"
      hidden
    >
      <label
        >左侧轮次
        <select id="compareLeft"></select></label
      ><label
        >右侧轮次
        <select id="compareRight"></select></label
      ><span class="toolbar-note">红色为删除 · 绿色为新增</span>
    </div>
    <main>
      <section
        id="shortcutsPanel"
        role="tabpanel"
        hidden
        aria-label="快捷键设置"
      >
        <div class="shortcut-heading">
          <h2>快捷键</h2>
          <div>
            <button id="resetShortcuts">恢复默认</button
            ><button id="saveShortcuts" class="primary">保存快捷键</button>
          </div>
        </div>
        <p class="shortcut-hint">
          点击右侧输入框后按下组合键，Backspace 清除，Esc 取消。
        </p>
        <p id="insertShortcutHint" class="shortcut-hint">
          添加：Ctrl+N → 1–6 选择标题 → Enter；直接 Enter 添加条目，Esc 取消。
        </p>
        <div id="shortcutStatus" role="status"></div>
        <div class="shortcut-groups"></div>
      </section>
      <section id="libraryPanel" role="tabpanel" hidden>
        <div class="library-toolbar">
          <button data-library-mode="createSet">新建词集</button
          ><button data-library-mode="createProject">新建项目</button
          ><button data-library-mode="openSet">打开 TXT</button
          ><button data-library-mode="openProject">打开项目文件夹</button
          ><span id="libraryStatus" role="status"></span>
        </div>
        <div id="libraryForm" class="library-card">
          <h2 id="libraryFormTitle">新建词集</h2>
          <label id="libraryNameLabel"
            >名称
            <input id="libraryName" placeholder="词集名称" maxlength="100"
          /></label>
          <div class="location-control">
            <span id="chosenLocation">尚未选择保存位置</span
            ><button id="chooseLocation">选择保存位置</button>
          </div>
          <button id="libraryCreate" class="primary" disabled>创建词集</button>
        </div>
        <div id="folderPicker" class="library-card" hidden>
          <div class="folder-address">
            <button id="folderUp" aria-label="上一级文件夹">↑</button
            ><input id="folderAddress" aria-label="文件夹路径" /><button
              id="folderGo"
            >
              前往
            </button>
          </div>
          <div id="folderShortcuts"></div>
          <div id="folderEntries"></div>
          <div class="folder-actions">
            <button id="folderCancel">取消选择</button
            ><button id="folderUse" class="primary">使用此文件夹</button>
          </div>
        </div>
        <div class="library-columns">
          <aside class="library-card">
            <h2>项目</h2>
            <div id="projectsList"></div>
          </aside>
          <div class="library-card">
            <h2>提示词集</h2>
            <div id="setsList"></div>
            <details id="trashSection">
              <summary>词集回收站</summary>
              <div id="trashList"></div>
            </details>
          </div>
        </div>
      </section>
      <section id="editorPanel" role="tabpanel">
        <article id="paper" aria-label="提示词编辑区"></article>
      </section>
      <section id="previewPanel" role="tabpanel" hidden>
        <article id="previewContent" class="markdown-preview"></article>
        <pre id="rawMarkdown" hidden></pre>
      </section>
      <section id="comparePanel" role="tabpanel" hidden>
        <div class="comparison-head">
          <strong id="leftTitle"></strong><strong id="rightTitle"></strong>
        </div>
        <div id="diffScroll"><div id="diffRows"></div></div>
      </section>
    </main>
    <footer>
      <span id="status" role="status">正在载入…</span
      ><span class="keys">Enter 下一条 · Shift+Enter 换行</span
      ><span class="spacer"></span><span id="stats"></span>
    </footer>
    <div
      id="headingMenu"
      class="menu"
      role="menu"
      aria-label="添加 Markdown 标题"
      hidden
    >
      <button id="menuAddItem" role="menuitem">＋ <span>添加条目</span></button
      ><button data-level="1" role="menuitem">
        H1 <span>一级标题</span><small>#</small></button
      ><button data-level="2" role="menuitem">
        H2 <span>二级标题</span><small>##</small></button
      ><button data-level="3" role="menuitem">
        H3 <span>三级标题</span><small>###</small></button
      ><button data-level="4" role="menuitem">
        H4 <span>四级标题</span><small>####</small></button
      ><button data-level="5" role="menuitem">
        H5 <span>五级标题</span><small>#####</small></button
      ><button data-level="6" role="menuitem">
        H6 <span>六级标题</span><small>######</small>
      </button>
    </div>
    <nav id="edgeNavigation" aria-label="页面跳转">
      <button
        type="button"
        data-edge="up"
        data-visible="false"
        aria-label="到顶部"
        title="到顶部"
        aria-hidden="true"
        tabindex="-1"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 5h12M7 13l5-5 5 5M12 8v12" />
        </svg>
      </button>
      <button
        type="button"
        data-edge="down"
        data-visible="false"
        aria-label="到底部"
        title="到底部"
        aria-hidden="true"
        tabindex="-1"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 19h12M7 11l5 5 5-5M12 4v12" />
        </svg>
      </button>
    </nav>
    <div id="toast" role="status"></div>
    <script src="diagnostics.js"></script>
    <script type="module" src="app.js"></script>
    <script type="module" src="desktop-chrome.js"></script>
  </body>
</html>
